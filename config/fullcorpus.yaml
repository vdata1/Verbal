# Verbal pipeline — full-corpus scale configuration.
#
# Identical to default.yaml EXCEPT the corpus is the full 537,805-row corpus
# (data/uniq-regexes-8.json). The run size is chosen at launch with
# `--limit N` (deterministic first-N slice; positional, stable ids), so this one
# config serves every scale tier. Because the samples are nested first-N slices
# of this same file (sample-3000 == rows 0-2999 byte-identical), first-N here is a
# strict superset of the prior runs: rows 0-2999 RE-CONFIRM the fixes at scale and
# rows 3000..N-1 are genuinely NEW, never-scanned regexes.
#
# This is the single source of experiment parameters (CLAUDE.md: "configuration
# over code"). Every value is applied UNIFORMLY to every regex / API / seed by the
# pipeline core; nothing keys on a specific regex id or API name. No overrides.
#
# The resolved contents of this file are hashed into every artifact's provenance
# header (config_sha), and the corpus byte-sha256 into corpus_sha, so a result can
# always be traced back to the exact config + data that produced it.

# --- Reproducibility ---------------------------------------------------------
# The single experiment seed. Threaded from here into Fandango's `random_seed`
# and into Python's `random` at pipeline entry. No unseeded randomness anywhere.
seed: 0

# --- Corpus ------------------------------------------------------------------
# Full corpus (JSONL: one object per line, each with a "pattern" field). The
# file's byte-sha256 is recorded in provenance (corpus_sha) as the data version.
corpus: data/uniq-regexes-8.json
# Default deterministic first-N slice; override at launch with `--limit N`.
eval_slice: 10000

# --- Specialization knobs (uniform across all regexes/APIs) ------------------
# Upper bound K for the matchAll `<start> ::= <pad> (<m> <pad>){2,K}` rewrite.
matchall_k: 3
# Ordered candidate pads for the per-regex filler (no universal pad exists; this
# is a candidate list tried in order, same rule for every regex).
pad_candidates: ["\n", " ", "\t", "X", "\0", " "]

# --- Flag-variation dimension (uniform across all regexes/APIs) --------------
# Optional flag sets UNIONed onto the mandatory base (API required + regex
# required). Required-only base always tested. Allowed: d g i m s u v y.
# y (sticky) + g drive the lastIndex preset battery; d (hasIndices) adds match spans.
# v (unicodeSets, ES2024) SUPERSEDES a required u rather than unioning with it (uv is a
# SyntaxError everywhere) -- so on a \p{...} pattern the v variant replaces the u one,
# which is the whole point: that is where set notation and property-escape folding live.
flag_variants: ["", "i", "m", "s", "y", "d", "g", "v"]

# --- Chaos: boundary inputs from mutated matching strings --------------------
# Each generated string is perturbed `chaos_n` times and the mutants are tested as
# ordinary cases, to reach the boundary/negative inputs the grammar cannot produce
# (analysis/EXPERIMENT_GAPS.md, G7). Every string record carries `origin`
# (fuzz|chaos). Harness count is ~(1 + chaos_n)x. `chaos_n: 0` disables.
chaos_n: 2
chaos_ops: [delete, insert, substitute, duplicate, transpose, case_flip, truncate]
chaos_alphabet: ["a", "Z", "0", " ", "\n", "é", "𐐷"]

# --- Fandango fuzzing --------------------------------------------------------
fuzz_n: 20                 # desired_solutions per specialized .fan
fuzz_max_generations: 200  # max_generations passed to fuzz()
fuzz_timeout_s: 30         # wall-clock budget per .fan (killable child)

# --- Neutral oracle (py-re match counts) -------------------------------------
# Wall-clock budget for counting py_re_matches over ONE (regex, api) string batch.
# Python `re` has no timeout and backtracks catastrophically on nested quantifiers
# (row 6580, `#define\s+(\S+)+\s+(\S+)`, wedged a chunk for hours). Chaos mutants are
# the trigger: a non-matching string forces the full exponential search. On expiry
# the counting child is SIGKILLed and unmeasured strings record py_re_matches: null
# (unknown -- NOT 0, which would read as a miscompilation).
neutral_count_timeout_s: 30

# --- ReDoS performance tracker -----------------------------------------------
# The harness reports `exec_ms` (performance.now() around the api call only). A case
# is a CANDIDATE if exec_ms exceeds redos_slow_ms on ANY engine, OR if any engine hit
# the harness timeout. That second trigger is not a fallback -- it is the important
# one: the harness prints its envelope only AFTER the api call returns, so an engine
# still backtracking when the budget expires is killed having reported no exec_ms at
# all. The worst cases are therefore invisible to timing alone (measured: /(a+)+$/ on
# a 32-char non-matching input -- node and deno run for MINUTES and are killed, while
# bun returns in 686ms; only bun reports a number, and it is under the threshold. The
# V8 blowup is exponential, so its wall-clock is machine-dependent -- one unloaded host
# gave node 186s / deno 149s -- but bun's 686ms reproduces exactly).
# A candidate is not a finding: it is observed inside the parallel worker pool, where
# load inflates timings.
# Candidates are re-executed serially and unloaded in a phase after the pool drains,
# and kept only if they are still slow. A confirmed case is flagged engine-specific
# when slowest/fastest across engines >= redos_engine_ratio -- one engine backtracking
# where the others do not is exactly this project's differential signal.
# NOTE: this does NOT prove ReDoS. That needs superlinear blowup as input length
# GROWS, and nothing here varies length. Not because the strings are short -- measured
# over the 6000-9999 window they are p50 21 chars, p90 60, max 285 -- but because the
# ~20 strings per regex are UNRELATED to each other, and a growth curve cannot be
# fitted across strings that share no shape: each carries its own constant factor.
# What is missing is a length FAMILY (one shape at growing n), which is a structural
# gap, not a magnitude one. Until that exists, a confirmed case is engine-specific
# slowness, not a proven catastrophic backtrack.
redos_slow_ms: 1000        # >1s of in-harness api execution = candidate
redos_engine_ratio: 10.0   # slowest/fastest engine factor that reads as engine-specific

# --- Eval engines (differential targets) -------------------------------------
engines: [node, bun, deno]
